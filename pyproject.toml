[project]
name = "mycode-coding-agent"
version = "0.1.0"
description = "A terminal coding agent with tool calling, context management, subagents, MCP, and skills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "mmc-cloud" }
]

keywords = [
    "coding-agent",
    "ai-agent",
    "cli",
    "tui",
    "mcp",
]
dependencies = [
    "editables~=0.3",
    "httpx>=0.28.1,<1",
    "httpx2>=2.5.0,<3",
    "jsonschema>=4.25.1,<5",
    "mcp>=2.1.1,<3",
    "openai>=2.43.0,<3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2,<7",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
]


[project.scripts]
mycode = "mycode.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycode"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
