[project]
name = "mycode-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "editables~=0.3",
    "httpx>=0.28.1,<1",
    "openai>=2.43.0,<3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2,<7",
    "python-dotenv>=1.2.2",
]


[project.scripts]
mycode = "mycode.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycode"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
